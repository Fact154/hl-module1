spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${POSTGRES_DB}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.auto-commit=true
spring.datasource.hikari.pool-name=HikariPool-1

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.hbm2ddl.auto=validate
spring.jpa.show-sql=true

spring.flyway.baseline-on-migrate=true
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.driver=org.postgresql.Driver
spring.flyway.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${POSTGRES_DB}
spring.flyway.user=${POSTGRES_USER}
spring.flyway.password=${POSTGRES_PASSWORD}


resilience4j.circuitbreaker.instances.coreServiceCircuitBreaker.slidingWindowSize=10
resilience4j.circuitbreaker.instances.coreServiceCircuitBreaker.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.coreServiceCircuitBreaker.failureRateThreshold=50
resilience4j.circuitbreaker.instances.coreServiceCircuitBreaker.waitDurationInOpenState=5s
resilience4j.circuitbreaker.instances.coreServiceCircuitBreaker.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.instances.coreServiceCircuitBreaker.automaticTransitionFromOpenToHalfOpenEnabled=true


# logging.level.ru.hpclab.hl.module1.service.KafkaConsumerService=DEBUG
logging.level.ru.hpclab.hl.module1.service=DEBUG

spring.kafka.bootstrap-servers=${KAFKA_HOSTS}
spring.kafka.consumer.group-id=museum-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.concurrency=2
spring.kafka.topic=museum-topic
spring.kafka.consumer.enable-auto-commit=true

# Crash endpoint configuration
app.crash.base-url=http://main-service-internal:8080
app.crash.endpoint=/crash


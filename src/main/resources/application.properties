spring.datasource.url=jdbc:postgresql://${DBHOST:hl21.zil}:${DBPORT:5432}/${DBNAME:module1}
spring.datasource.username=${DBUSER:postgres}
spring.datasource.password=${DBPASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.hbm2ddl.auto=validate
spring.jpa.show-sql=true

spring.flyway.baseline-on-migrate=true
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.driver=org.postgresql.Driver
spring.flyway.url=jdbc:postgresql://${DBHOST:hl21.zil}:${DBPORT:5432}/${DBNAME:module1}
spring.flyway.user=${DBUSER:postgres}
spring.flyway.password=${DBPASSWORD:postgres}

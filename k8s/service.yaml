apiVersion: v1
kind: Service
metadata:
  name: museum-service
  namespace: var9
spec:
  type: LoadBalancer
  ports:
    - name: main
      port: 8080
      targetPort: 8080
      protocol: TCP
    - name: stats
      port: 8081
      targetPort: 8081
      protocol: TCP
  selector:
    app: museum-main 
apiVersion: apps/v1
kind: ReplicaSet
metadata:
  name: museum-main-rs
  namespace: var9
spec:
  replicas: 3
  selector:
    matchLabels:
      app: museum-main
  template:
    metadata:
      labels:
        app: museum-main
    spec:
      hostAliases:
      - ip: "10.60.3.27"
        hostnames:
        - "hl22.zil"
      - ip: "10.60.3.28"
        hostnames:
        - "hl23.zil"
      containers:
      - name: museum-main
        image: fact154/main-service:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
        envFrom:
        - configMapRef:
            name: museum-config
        - secretRef:
            name: museum-secrets
        resources:
          requests:
            memory: "1Gi"
            cpu: "1"
          limits:
            memory: "1Gi"
            cpu: "1"
      imagePullSecrets:
      - name: dockerhub-secret

apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: museum-stats-hpa
  namespace: var9
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: museum-stats 
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 20
      policies:
        - type: Pods
          value: 1
          periodSeconds: 15
    scaleDown:
      stabilizationWindowSeconds: 20
      policies:
        - type: Pods
          value: 1
          periodSeconds: 30

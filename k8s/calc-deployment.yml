apiVersion: apps/v1
kind: Deployment
metadata:
  name: museum-stats
  namespace: var9
spec:
  replicas: 1
  selector:
    matchLabels:
      app: museum-stats
  template:
    metadata:
      labels:
        app: museum-stats
    spec:
      containers:
      - name: museum-stats
        image: fact154/stats-service:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8081
        envFrom:
        - configMapRef:
            name: museum-config
        - secretRef:
            name: db-secret
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
      imagePullSecrets:
      - name: dockerhub-secret 
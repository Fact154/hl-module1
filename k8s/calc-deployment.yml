apiVersion: apps/v1
kind: Deployment
metadata:
  name: museum-stats
  namespace: var9
spec:
  replicas: 1
  selector:
    matchLabels:
      app: museum-stats
  template:
    metadata:
      labels:
        app: museum-stats
    spec:
      containers:
      - name: museum-stats
        image: fact154/stats-service:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8081
        env:
          - name: SERVER_PORT
            value: "8081"
        envFrom:
        - configMapRef:
            name: museum-config
        - secretRef:
            name: museum-secrets
        resources:
          requests:
            memory: "1Gi"
            cpu: "1"
          limits:
            memory: "1Gi"
            cpu: "1"
      imagePullSecrets:
      - name: dockerhub-secret

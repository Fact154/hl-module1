apiVersion: v1
kind: Service
metadata:
  name: museum-main
  namespace: var9
spec:
  type: NodePort
  selector:
    app: museum-main
  ports:
  - port: 8080
    targetPort: 8080
    nodePort: 30000
---
apiVersion: v1
kind: Service
metadata:
  name: museum-stats
  namespace: var9
spec:
  type: NodePort
  selector:
    app: museum-stats
  ports:
  - port: 8081
    targetPort: 8081
    nodePort: 30001
---
apiVersion: v1
kind: Service
metadata:
  name: main-service-internal
  namespace: var9
spec:
  type: NodePort
  ports:
  - port: 8080
    targetPort: 8080
    nodePort: 30080
  selector:
    app: museum-main
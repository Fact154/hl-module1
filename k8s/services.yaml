apiVersion: v1
kind: Service
metadata:
  name: main-service
spec:
  type: NodePort
  ports:
  - port: 8080
    targetPort: 8080
    nodePort: 30000
  selector:
    app: main-service
---
apiVersion: v1
kind: Service
metadata:
  name: stats-service
spec:
  type: NodePort
  ports:
  - port: 8081
    targetPort: 8081
    nodePort: 30001
  selector:
    app: stats-service
---
apiVersion: v1
kind: Service
metadata:
  name: main-service-internal
spec:
  ports:
  - port: 8080
    targetPort: 8080
  selector:
    app: main-service 
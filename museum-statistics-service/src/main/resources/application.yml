server:
  port: 8081

spring:
  application:
    name: museum-statistics-service
  jpa:
    enabled: false
  datasource:
    enabled: false
  flyway:
    enabled: false
  task:
    execution:
      pool:
        core-size: 2
        max-size: 4
        queue-capacity: 100

resilience4j:
  retry:
    configs:
      default:
        max-attempts: 5
        wait-duration: 30000
        retry-exceptions:
          - org.springframework.web.reactive.function.client.WebClientResponseException
          - java.net.ConnectException
          - java.net.SocketTimeoutException
          - org.springframework.web.reactive.function.client.WebClientRequestException
    instances:
      coreServiceRetry:
        base-config: default
        register-health-indicator: true
        wait-duration: 30000
        max-attempts: 5
  circuitbreaker:
    configs:
      default:
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 5s
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
    instances:
      coreServiceCircuitBreaker:
        base-config: default
        register-health-indicator: true

museum:
  url: ${MUSEUM_URL}

statistics:
  cache:
    info: "Cache Statistics"
    delay: 1000
    print:
      rate: 0
  monitor:
    interval: 5000 